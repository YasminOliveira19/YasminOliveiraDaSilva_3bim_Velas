<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière | Produtos</title>
    <link rel="stylesheet" href="produtos.css">
</head>

<body onload="listar()">
    <!-- Cabeçalho Semântico -->
    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie seu catálogo de Velas aromáticas.</p>

        <nav>
            <a href="../menu/menu.html">Menu</a>
            <a href="../produto/produtos.html">Produtos</a>
            <a href="../categoria/categorias.html">Categorias</a>
            <a href="../cliente/clientes.html">Clientes</a>
        </nav>

    </header>

    <!-- Conteúdo Principal -->
    <main class="container-master">

        <div class="conteudo-principal">
            <!-- Seção do Formulário -->
            <section class="form-esquerda">
                <h2>Dados do Produto</h2>

                <label for="inputId_produto">ID do Produto</label>
                <div class="linha-id">
                    <input type="text" name="inputId_produto" id="inputId_produto" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_produto">Nome do Produto</label>
                <input type="text" name="inputNome_produto" id="inputNome_produto">

                <label for="inputCategoria_produto"> Id da Categoria</label>
                <input type="number" name="inputCategoria_produto" id="inputCategoria_produto">

                <label for="inputUnidade_medida">Unidade de Medida</label>

                <select id="inputUnidade_medida" name="inputUnidade_medida">
                    <option value="">Selecione</option>
                    <option value="1">200g</option>
                    <option value="2">400g</option>
                    <option value="3">600g</option>
                </select>

                <label for="inputEstoque">Estoque</label>
                <input type="number" name="inputEstoque" id="inputEstoque">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()"
                        style="display:none;">
                </div>
            </section>

            <!-- Aside para o Cartaz (Conteúdo Lateral) -->
            <aside class="form-direita">
                <h2>Imagem do Produto</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imgCartaz" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;"
                        onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <!-- Seção da Listagem -->
        <section class="lista-Produto">
            <h3>Produtos Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>

    </main>

    <!-- Rodapé Semântico -->
    <footer>
        <p>Lumière</p>

        <p>Yasmin Oliveira da Silva | DW1 | M32 | 2026</p>
    </footer>

    <script src="produtos.js"></script>
</body>

</html>
